# === Gradle daemon JVM 設定 ===
# -Xmx4g              : daemon ヒープを明示（デフォルト512mでは大規模javacで不足しがち）
# -XX:TieredStopAtLevel=1 : JITをC1で停止。
#   2026-11-24 Windows(JDK 25)で C2 CompilerThread が
#   EXCEPTION_ACCESS_VIOLATION (hs_err_pid27244.log) により daemon が
#   消失する問題を回避するための設定。コンパイルは少し遅くなるが安定する。
#   不要になったら本フラグを外せば元の高速JITに戻る。
# -Dfile.encoding=UTF-8 : Windows のシステムコードページ依存による文字化け防止
org.gradle.jvmargs=-Xmx4g -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8

# Gradleのネイティブライブラリローダーの警告を抑制

# Javaのモジュールシステムの警告を抑制（オプション）
# この設定はGradleのネイティブライブラリローダーの警告を抑制しますが、
# 完全には抑制できない場合があります（Gradle側の問題のため）

